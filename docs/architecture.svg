<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <style>
      .box{fill:#0f172a;stroke:#334155;stroke-width:1.5;rx:10}
      .lane{fill:#0b1220;stroke:#1e293b;stroke-width:1;rx:14}
      .t{fill:#e2e8f0;font-size:14px;font-weight:600}
      .s{fill:#94a3b8;font-size:12px}
      .lt{fill:#64748b;font-size:11px;letter-spacing:.12em;font-weight:700}
      .ev{fill:#fbbf24;font-size:11px}
      .ln{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .acc{fill:#22d3ee}
    </style>
  </defs>
  <rect width="1240" height="720" fill="#020617"/>
  <text x="32" y="40" fill="#f8fafc" font-size="22" font-weight="700">CivicLens AI — architecture</text>
  <text x="32" y="62" class="s">USAspending prime contract transactions → Databricks Bronze/Silver/Gold (Delta) → versioned read-only snapshot → FastAPI + Next.js → grounded AI investigator. Every stage writes stamped evidence.</text>

  <!-- lane 1: source + ingest -->
  <rect x="32" y="90" width="1176" height="120" class="lane"/>
  <text x="48" y="112" class="lt">1 · SOURCE &amp; INGEST (GitHub Actions)</text>
  <rect x="48" y="124" width="262" height="70" class="box"/>
  <text x="64" y="150" class="t">USAspending.gov API</text>
  <text x="64" y="170" class="s">download · count · spending_over_time</text>
  <text x="64" y="186" class="s">6 agencies × FY2022–26 = 30 cells</text>

  <rect x="330" y="124" width="276" height="70" class="box"/>
  <text x="346" y="150" class="t">civiclens_ingest</text>
  <text x="346" y="170" class="s">retries · cached-job detection · re-pull</text>
  <text x="346" y="186" class="s">manifest per cell (sha256, api_count, rows)</text>

  <rect x="626" y="124" width="292" height="70" class="box"/>
  <text x="642" y="150" class="t">Reconciliation (independent)</text>
  <text x="642" y="170" class="s">R1 cell counts ≤0.5% · R2 sums to the cent</text>
  <text x="642" y="186" class="s">R3 agency-year vs spending_over_time</text>

  <rect x="934" y="124" width="258" height="70" class="box"/>
  <text x="950" y="150" class="t">Raw artifact + DuckDB build</text>
  <text x="950" y="170" class="s">same SQL files as Spark · DQ gate</text>
  <text x="950" y="186" class="ev">evidence/ingest · reconcile · pipeline</text>

  <path d="M310 159H330" class="ln"/><path d="M606 159H626" class="ln"/><path d="M918 159H934" class="ln"/>

  <!-- lane 2: lakehouse -->
  <rect x="32" y="226" width="580" height="150" class="lane"/>
  <text x="48" y="248" class="lt">2 · LAKEHOUSE (Databricks serverless, Unity Catalog)</text>
  <rect x="48" y="262" width="160" height="96" class="box"/>
  <text x="64" y="288" class="t">Bronze</text>
  <text x="64" y="308" class="s">Volume bronze.raw</text>
  <text x="64" y="324" class="s">prime_transactions Delta</text>
  <text x="64" y="340" class="s">schema contract</text>
  <rect x="232" y="262" width="160" height="96" class="box"/>
  <text x="248" y="288" class="t">Silver</text>
  <text x="248" y="308" class="s">typed · deduped · FY</text>
  <text x="248" y="324" class="s">rejects table (why)</text>
  <text x="248" y="340" class="s">one SQL, Spark + DuckDB</text>
  <rect x="416" y="262" width="180" height="96" class="box"/>
  <text x="432" y="288" class="t">Gold + anomalies</text>
  <text x="432" y="308" class="s">award · agency · recipient</text>
  <text x="432" y="324" class="s">large_award (robust z, log10)</text>
  <text x="432" y="340" class="s">concentration HHI · growth</text>
  <path d="M208 310H232" class="ln"/><path d="M392 310H416" class="ln"/>

  <!-- lane 2b: validation -->
  <rect x="628" y="226" width="580" height="150" class="lane"/>
  <text x="644" y="248" class="lt">3 · INDEPENDENT VALIDATION</text>
  <rect x="644" y="262" width="260" height="96" class="box"/>
  <text x="660" y="288" class="t">Cross-engine parity</text>
  <text x="660" y="308" class="s">Databricks Delta vs DuckDB, same raw data:</text>
  <text x="660" y="324" class="s">rows, rejects, Σ obligations, Gold = Silver,</text>
  <text x="660" y="340" class="s">flagged + scored counts (all equal)</text>
  <rect x="928" y="262" width="264" height="96" class="box"/>
  <text x="944" y="288" class="t">Anomaly validator (NumPy)</text>
  <text x="944" y="308" class="s">3 detectors re-implemented, every row</text>
  <text x="944" y="324" class="s">flagged values traced to raw rows</text>
  <text x="944" y="340" class="ev">evidence/pipeline · evidence/anomalies</text>
  <path d="M596 310H644" class="ln"/>

  <!-- lane 3: publish -->
  <rect x="32" y="392" width="1176" height="92" class="lane"/>
  <text x="48" y="414" class="lt">4 · PUBLISH (DQ-gated, immutable)</text>
  <rect x="48" y="426" width="340" height="46" class="box"/>
  <text x="64" y="448" class="t">snapshot-&lt;version&gt; GitHub Release asset</text>
  <text x="64" y="464" class="s">civiclens_&lt;v&gt;.duckdb + sha256 · latest.json promoted last</text>
  <rect x="440" y="426" width="340" height="46" class="box"/>
  <text x="456" y="448" class="t">Fly.io image build</text>
  <text x="456" y="464" class="s">snapshot baked in, sha256-verified · X-Snapshot-Version</text>
  <rect x="832" y="426" width="360" height="46" class="box"/>
  <text x="848" y="448" class="t">Rollback</text>
  <text x="848" y="464" class="s">re-deploy an older release; latest.json is the only pointer</text>
  <path d="M388 449H440" class="ln"/>

  <!-- lane 4: serving -->
  <rect x="32" y="500" width="1176" height="196" class="lane"/>
  <text x="48" y="522" class="lt">5 · SERVING (public)</text>
  <rect x="48" y="536" width="300" height="140" class="box"/>
  <text x="64" y="562" class="t">FastAPI on Fly.io (shared-cpu-1x)</text>
  <text x="64" y="582" class="s">/v1/overview · agency · anomalies · awards</text>
  <text x="64" y="598" class="s">/v1/search · /v1/sql (published queries) · /healthz</text>
  <text x="64" y="614" class="s">read-only DuckDB · CORS allowlist · rate limits</text>
  <text x="64" y="630" class="s">per-IP/hour · global/day · $ budget → cache</text>
  <text x="64" y="646" class="s">secrets only via Fly/Actions secrets</text>

  <rect x="400" y="536" width="380" height="140" class="box"/>
  <text x="416" y="562" class="t">AI investigator (Claude Haiku, tool use)</text>
  <text x="416" y="582" class="s">6 read-only tools = the dashboard's query functions</text>
  <text x="416" y="598" class="s">final_answer: facts(tool_call_id, measure, entities) · citations</text>
  <text x="416" y="614" class="s">server verify(): every number re-found in that call's rows</text>
  <text x="416" y="630" class="s">prose grounding · derived arithmetic · conduct scrub</text>
  <text x="416" y="646" class="s">eval: 40-case regression + 24-case independent holdout</text>
  <text x="416" y="664" class="ev">evidence/eval · evidence/eval/holdout</text>

  <rect x="832" y="536" width="360" height="140" class="box"/>
  <text x="848" y="562" class="t">Next.js 15 on Vercel</text>
  <text x="848" y="582" class="s">Overview · Agency Explorer · Anomaly Lab (Why?)</text>
  <text x="848" y="598" class="s">AI Investigator · Methodology (published SQL)</text>
  <text x="848" y="614" class="s">scope in URL · empty/error/loading states</text>
  <text x="848" y="630" class="s">Playwright e2e desktop + Pixel 7 + axe WCAG 2.1 AA</text>
  <text x="848" y="646" class="s">against the LIVE site after every deploy</text>
  <text x="848" y="664" class="ev">evidence/deploy · docs/demo · docs/screenshots</text>

  <path d="M348 606H400" class="ln"/><path d="M780 606H832" class="ln"/>
  <path d="M610 472V536" class="ln"/>
  <path d="M218 358V392" class="ln" transform="translate(0,0)"/>
</svg>
