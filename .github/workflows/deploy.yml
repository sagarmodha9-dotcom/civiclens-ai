name: deploy
# Public deployment, pinned to a published snapshot version:
#   API  -> Fly.io (one shared-cpu-1x machine, always on; image built with the snapshot baked in and sha256-verified)
#   Web  -> Vercel (Next.js, NEXT_PUBLIC_API_URL pointed at the Fly app)
# then smoke tests + the full Playwright e2e suite (desktop + mobile + axe) against the LIVE site, and a stamped
# evidence/deploy/report.md (run id, commit, snapshot version, URLs, PASS/FAIL). Approved spend: Fly <= $5/month.
# Secrets: FLY_API_TOKEN, VERCEL_TOKEN, ANTHROPIC_API_KEY (already set).
on:
  workflow_dispatch:
    inputs:
      snapshot_version:
        description: "snapshot version to deploy (blank = snapshot/latest.json)"
        default: ""
      skip_web:
        description: "deploy API only"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: deploy
env:
  FLY_APP: civiclens-api
  FLY_REGION: iad
  VERCEL_PROJECT: civiclens-ai
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve snapshot
        id: snap
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          want = "${{ inputs.snapshot_version }}".strip()
          m = json.load(open("snapshot/latest.json"))
          if want and want != m["version"]:
              raise SystemExit(f"requested {want} but snapshot/latest.json is {m['version']}; promote it first (publish-snapshot) or pass blank")
          print(f"version={m['version']}"); print(f"file={m['file']}"); print(f"sha256={m['sha256']}")
          print(f"url=https://github.com/${{ github.repository }}/releases/download/snapshot-{m['version']}/{m['file']}")
          EOF
          cat "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly app, volume, secrets (idempotent)
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
        run: |
          flyctl apps list | grep -q "^$FLY_APP" || flyctl apps create "$FLY_APP" --org personal
          flyctl volumes list -a "$FLY_APP" | grep -q civiclens_ledger || flyctl volumes create civiclens_ledger -a "$FLY_APP" --region "$FLY_REGION" --size 1 --yes
          flyctl secrets set -a "$FLY_APP" --stage ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" >/dev/null
      - name: Deploy API (image built with the pinned snapshot)
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
        run: |
          flyctl deploy . --config api/fly.toml --dockerfile api/Dockerfile --app "$FLY_APP" --remote-only --ha=false \
            --build-arg SNAPSHOT_URL="${{ steps.snap.outputs.url }}" --build-arg SNAPSHOT_SHA256="${{ steps.snap.outputs.sha256 }}" \
            --vm-size shared-cpu-1x --vm-memory 512
      - name: API smoke (must serve exactly the pinned snapshot)
        id: api
        run: |
          API="https://$FLY_APP.fly.dev"; echo "url=$API" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 20); do curl -fsS "$API/healthz" && break || sleep 6; done
          python3 - "$API" "${{ steps.snap.outputs.version }}" <<'EOF'
          import json, sys, urllib.request
          api, want = sys.argv[1], sys.argv[2]
          h = json.load(urllib.request.urlopen(api + "/healthz", timeout=20))
          assert h["ok"] and h["snapshot_version"] == want, h
          assert h.get("dq_all_pass") is True, h
          r = urllib.request.urlopen(api + "/v1/overview", timeout=30)
          assert r.headers.get("X-Snapshot-Version") == want, dict(r.headers)
          o = json.load(r); print("overview keys:", list(o)[:8])
          s = json.load(urllib.request.urlopen(api + "/v1/investigate/samples", timeout=20)); print("investigator live:", s.get("live"))
          print("API OK", want)
          EOF
      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_web }}
        with: { node-version: "20" }
      - name: Deploy web (Vercel, production)
        if: ${{ !inputs.skip_web }}
        id: web
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        working-directory: web
        run: |
          npm i -g vercel@latest >/dev/null
          vercel project add "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true     # idempotent: exists already after the first run
          vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
          vercel env rm NEXT_PUBLIC_API_URL production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "${{ steps.api.outputs.url }}" | vercel env add NEXT_PUBLIC_API_URL production --token "$VERCEL_TOKEN"
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2>/dev/null | tail -1)
          echo "deployment=$URL"
          # stable production alias from the project record (run 40010130351 fell back to the per-deployment URL)
          ALIAS=$(python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.vercel.com/v9/projects/" + os.environ["VERCEL_PROJECT"], headers={"Authorization": "Bearer " + os.environ["VERCEL_TOKEN"]})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          al = [a["domain"] if isinstance(a, dict) else a for a in (d.get("targets", {}).get("production", {}) or {}).get("alias", [])]
          al = [a for a in al if a.endswith(".vercel.app") and "-git-" not in a] or al
          print("https://" + sorted(al, key=len)[0] if al else "")
          PY
          )
          [ -n "$ALIAS" ] || ALIAS="$URL"
          echo "url=$ALIAS" >> "$GITHUB_OUTPUT"; echo "site: $ALIAS"
      - name: Point API CORS at the site
        if: ${{ !inputs.skip_web }}
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
        run: flyctl secrets set -a "$FLY_APP" CIVICLENS_CORS="${{ steps.web.outputs.url }},https://$VERCEL_PROJECT.vercel.app"
      - name: Live API access-control smoke (CORS allowlist, validation, read-only surface, headers)
        if: ${{ !inputs.skip_web }}
        id: apisec
        run: |
          sleep 20; for i in $(seq 1 20); do curl -fsS "${{ steps.api.outputs.url }}/healthz" >/dev/null && break || sleep 6; done
          python3 - "${{ steps.api.outputs.url }}" "${{ steps.web.outputs.url }}" <<'EOF'
          import json, sys, urllib.request, urllib.error
          api, site = sys.argv[1], sys.argv[2]
          def call(path, method="GET", data=None, headers=None):
              req = urllib.request.Request(api + path, data=data, method=method, headers=headers or {})
              try:
                  r = urllib.request.urlopen(req, timeout=30); return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
          checks = {}
          st, h, _ = call("/v1/overview", "OPTIONS", headers={"Origin": "https://evil.example", "Access-Control-Request-Method": "GET"})
          checks["cors_rejects_unknown_origin"] = "access-control-allow-origin" not in {k.lower() for k in h}
          st, h, _ = call("/v1/overview", "OPTIONS", headers={"Origin": site, "Access-Control-Request-Method": "GET"})
          checks["cors_allows_site"] = {k.lower(): v for k, v in h.items()}.get("access-control-allow-origin") == site
          st, h, _ = call("/v1/investigate", "POST", data=b'{"question": "x"}', headers={"Content-Type": "application/json"})
          checks["investigate_validates_input_422"] = st == 422
          st, h, _ = call("/v1/investigate", "POST", data=b'{"question": "total?", "agency": "999"}', headers={"Content-Type": "application/json"})
          checks["unknown_agency_rejected_422"] = st == 422
          st, h, b = call("/v1/overview", "DELETE")
          checks["no_write_methods_405"] = st == 405
          st, h, b = call("/v1/sql"); checks["published_sql_readable"] = st == 200 and b"SELECT" in b
          st, h, _ = call("/healthz"); hl = {k.lower(): v for k, v in h.items()}
          checks["security_headers"] = hl.get("x-content-type-options") == "nosniff" and "x-snapshot-version" in hl
          st, h, b = call("/v1/investigate/samples"); d = json.loads(b)
          checks["rate_limits_advertised"] = d["limits"]["per_ip_per_hour"] <= 8 and d["limits"]["global_per_day"] <= 120
          print(json.dumps(checks, indent=1))
          json.dump(checks, open("api_access_checks.json", "w"))
          raise SystemExit(0 if all(checks.values()) else 1)
          EOF
        continue-on-error: true
      - name: Live e2e (desktop + mobile + accessibility) against the public site
        if: ${{ !inputs.skip_web }}
        id: e2e
        working-directory: web
        env: { E2E_BASE_URL: "${{ steps.web.outputs.url }}" }
        run: |
          npm ci >/dev/null && npx playwright install --with-deps chromium >/dev/null
          sleep 20
          npx playwright test 2>&1 | tee ../e2e.log | tail -25
          cp test-results/results.json ../e2e-results.json
          python3 -c "import json,sys; st=json.load(open('../e2e-results.json'))['stats']; print(st); sys.exit(1 if (st.get('expected',0) < 10 or st.get('unexpected',0)) else 0)"
        continue-on-error: true
      - name: Automated demo recording + screenshots of the public site
        if: ${{ !inputs.skip_web && steps.e2e.outcome == 'success' }}
        id: demo
        working-directory: web
        env: { E2E_BASE_URL: "${{ steps.web.outputs.url }}", DEMO: "1", PLAYWRIGHT_JSON_OUTPUT_NAME: "demo-results.json" }
        continue-on-error: true
        run: |
          mkdir -p ../docs/screenshots ../docs/demo
          npx playwright test demo.spec.ts --project=desktop 2>&1 | tail -8
          v=$(find test-results -name "*.webm" | head -1); echo "video: $v"
          test -n "$v" && ffmpeg -loglevel error -y -i "$v" -vf "fps=24,scale=1280:-2" -c:v libx264 -crf 26 -preset slow -pix_fmt yuv420p -movflags +faststart ../docs/demo/civiclens-demo.mp4
          ls -la ../docs/demo ../docs/screenshots
          python3 -c "import os,sys; sz=os.path.getsize('../docs/demo/civiclens-demo.mp4'); print('mp4 bytes', sz); sys.exit(1 if sz > 20_000_000 else 0)"
      - name: Evidence
        if: always()
        run: |
          mkdir -p evidence/deploy
          python3 - <<'EOF'
          import json, os, datetime as dt, pathlib
          res = {}
          try:
              r = json.load(open("e2e-results.json")); st = r.get("stats", {})
              res = {"expected": st.get("expected"), "unexpected": st.get("unexpected"), "skipped": st.get("skipped"), "duration_ms": st.get("duration")}
          except Exception as e: res = {"error": str(e)[:100]}
          sec = json.load(open("api_access_checks.json")) if pathlib.Path("api_access_checks.json").exists() else {}
          e2e_ok = "${{ steps.e2e.outcome }}" == "success" and (res.get("expected") or 0) >= 10 and not res.get("unexpected")   # tests must actually have run
          ok = "${{ steps.api.outcome }}" == "success" and ("${{ inputs.skip_web }}" == "true" or (e2e_ok and "${{ steps.apisec.outcome }}" == "success"))
          rep = {"stamp": {"github_run_id": "${{ github.run_id }}", "commit": "${{ github.sha }}"[:12], "utc": dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")},
                 "snapshot_version": "${{ steps.snap.outputs.version }}", "api_url": "${{ steps.api.outputs.url }}", "site_url": "${{ steps.web.outputs.url }}",
                 "api_smoke": "${{ steps.api.outcome }}", "web_deploy": "${{ steps.web.outcome }}", "e2e": "${{ steps.e2e.outcome }}", "e2e_results": res, "pass": ok,
                 "api_access_checks": sec, "api_access_outcome": "${{ steps.apisec.outcome }}",
                 "demo": "${{ steps.demo.outcome }}", "demo_video": "docs/demo/civiclens-demo.mp4" if pathlib.Path("docs/demo/civiclens-demo.mp4").exists() else None,
                 "screenshots": sorted(p.name for p in pathlib.Path("docs/screenshots").glob("*.png")) if pathlib.Path("docs/screenshots").exists() else [],
                 "cost_note": "Fly.io shared-cpu-1x 512MB always-on + 1GB volume (approved <= $5/mo); Vercel Hobby free; Anthropic capped at $10/mo in console, app budget $5/mo."}
          pathlib.Path("evidence/deploy/report.json").write_text(json.dumps(rep, indent=1))
          md = [f"# Deployment — **{'PASS' if ok else 'FAIL'}**", "",
                f"GitHub run `{rep['stamp']['github_run_id']}` · commit `{rep['stamp']['commit']}` · {rep['stamp']['utc']} · snapshot `{rep['snapshot_version']}`", "",
                f"- API: {rep['api_url']} — smoke {rep['api_smoke']} (healthz ok, snapshot version pinned, DQ pass, X-Snapshot-Version header)",
                f"- Site: {rep['site_url']} — deploy {rep['web_deploy']}",
                f"- Live e2e (Playwright desktop Chrome + Pixel 7 + axe WCAG 2.1 AA): {rep['e2e']} — {json.dumps(res)}",
                f"- Live API access-control smoke (CORS allowlist, 422 validation, 405 on writes, published SQL, headers, advertised rate limits): {rep['api_access_outcome']} — {json.dumps(sec)}",
                f"- Automated demo recording of the public site: {rep['demo']} — {rep['demo_video'] or 'none'}; screenshots: {len(rep['screenshots'])}",
                f"- Cost: {rep['cost_note']}"]
          pathlib.Path("evidence/deploy/report.md").write_text("\n".join(md) + "\n"); print("\n".join(md))
          EOF
          git config user.name civiclens-bot; git config user.email actions@users.noreply.github.com
          git add evidence/deploy docs/demo docs/screenshots 2>/dev/null; git commit -m "evidence: deployment run ${{ github.run_id }} (+demo, screenshots)" || echo "nothing to commit"
          pushed=0; for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && pushed=1 && break || sleep 10; done
          test "$pushed" = 1 || { echo "::error::evidence push failed"; exit 1; }
          python3 -c "import json,sys; sys.exit(0 if json.load(open('evidence/deploy/report.json'))['pass'] else 1)"
