name: lakehouse-databricks
# Uploads the raw data artifact to the Unity Catalog Volume, syncs the repo into the workspace, creates/updates the
# job from lakehouse/databricks/job.json, runs it, waits, and commits the DQ result to evidence/pipeline/.
on:
  workflow_dispatch:
    inputs:
      raw_artifact_run_id:
        description: "run id of the ingest-usaspending run whose raw artifact to upload (blank = skip upload)"
        default: ""
permissions:
  contents: write
  actions: read
env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  REPO_PATH: /Workspace/Users/${{ secrets.DATABRICKS_USER }}/civiclens-ai
concurrency: databricks
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests duckdb build
      - name: Working catalog (from the preflight; Free Edition cannot create catalogs)
        id: cat
        run: |
          c=$(cat evidence/databricks/catalog.txt 2>/dev/null || echo workspace); echo "catalog=$c" >> $GITHUB_OUTPUT; echo "catalog: $c"
      - name: Build artifact of the same ingest run (for Databricks-vs-DuckDB reconciliation)
        if: inputs.raw_artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: snapshot-*
          path: build
          merge-multiple: true
          run-id: ${{ inputs.raw_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download raw artifact
        if: inputs.raw_artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: raw-usaspending-*
          path: data/raw
          merge-multiple: true
          run-id: ${{ inputs.raw_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Upload raw cells to the Volume (Files API, one PUT per file)
        if: inputs.raw_artifact_run_id != ''
        env: { CATALOG: "${{ steps.cat.outputs.catalog }}" }
        run: |
          set -e
          python3 - <<'PY'
          import os, requests, pathlib
          from urllib.parse import urlsplit
          _h = os.environ["DATABRICKS_HOST"].strip(); _u = urlsplit(_h if "://" in _h else "https://" + _h)
          host, tok = f"{_u.scheme}://{_u.netloc}", os.environ["DATABRICKS_TOKEN"]
          root = pathlib.Path("data/raw"); n = 0
          for p in sorted(root.rglob("*")):
              if p.is_file() and (p.suffix in (".csv", ".json")):
                  rel = p.relative_to(root).as_posix()
                  url = f"{host}/api/2.0/fs/files/Volumes/{os.environ['CATALOG']}/bronze/raw/{rel}?overwrite=true"
                  with open(p, "rb") as f:
                      r = requests.put(url, headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/octet-stream"}, data=f, timeout=600)
                  r.raise_for_status(); n += 1
          print(f"uploaded {n} files")
          PY
      - name: Sync repo into the workspace and run the job
        id: job
        env: { CATALOG: "${{ steps.cat.outputs.catalog }}" }
        continue-on-error: true
        run: |
          set -e
          python3 - <<'PY'
          import os, json, time, requests, base64, pathlib
          from urllib.parse import urlsplit
          _h = os.environ["DATABRICKS_HOST"].strip(); _u = urlsplit(_h if "://" in _h else "https://" + _h)
          host, tok = f"{_u.scheme}://{_u.netloc}", os.environ["DATABRICKS_TOKEN"]
          H = {"Authorization": f"Bearer {tok}"}
          repo_path = os.environ["REPO_PATH"]
          # import the files the job needs (notebooks + the SQL package) via Workspace API
          def put(path, content: bytes, fmt="SOURCE", lang=None):
              body = {"path": path, "content": base64.b64encode(content).decode(), "overwrite": True, "format": fmt}
              if lang: body["language"] = lang
              r = requests.post(f"{host}/api/2.0/workspace/import", headers=H, json=body, timeout=60); r.raise_for_status()
          requests.post(f"{host}/api/2.0/workspace/mkdirs", headers=H, json={"path": f"{repo_path}/lakehouse/databricks"}, timeout=60).raise_for_status()
          requests.post(f"{host}/api/2.0/workspace/mkdirs", headers=H, json={"path": f"{repo_path}/lakehouse/civiclens_lakehouse/sql"}, timeout=60).raise_for_status()
          for nb in ("01_bronze", "02_silver_gold_anomalies"):
              put(f"{repo_path}/lakehouse/databricks/{nb}", open(f"lakehouse/databricks/{nb}.py","rb").read(), "SOURCE", "PYTHON")
          # The shared package (SQL files + PARAMS + schema contract) is delivered as a built wheel on the Volume and attached
          # to the serverless job as an environment dependency. Run 39996200492 showed reading .py files from the Workspace
          # filesystem can fail with EIO on serverless; a wheel is the supported path for shared Python code.
          import subprocess, glob
          subprocess.run(["python3", "-m", "build", "--wheel", "--outdir", "dist", "lakehouse"], check=True, capture_output=True)
          whl = sorted(glob.glob("dist/civiclens_lakehouse-*.whl"))[-1]
          whl_volume = f"/Volumes/{os.environ['CATALOG']}/bronze/raw/_libs/{pathlib.Path(whl).name}"
          with open(whl, "rb") as fh:
              r = requests.put(f"{host}/api/2.0/fs/files{whl_volume}?overwrite=true", headers={**H, "Content-Type": "application/octet-stream"}, data=fh, timeout=300)
          r.raise_for_status(); print("wheel on volume:", whl_volume)
          spec = json.loads(open("lakehouse/databricks/job.json").read().replace("${REPO_PATH}", repo_path).replace("${CATALOG}", os.environ["CATALOG"]).replace("${WHEEL}", whl_volume))
          def upsert_and_run(spec):
              jobs = requests.get(f"{host}/api/2.1/jobs/list", headers=H, params={"name": spec["name"]}, timeout=60).json().get("jobs", [])
              if jobs:
                  job_id = jobs[0]["job_id"]; requests.post(f"{host}/api/2.1/jobs/reset", headers=H, json={"job_id": job_id, "new_settings": spec}, timeout=60).raise_for_status()
              else:
                  job_id = requests.post(f"{host}/api/2.1/jobs/create", headers=H, json=spec, timeout=60).json()["job_id"]
              run_id = requests.post(f"{host}/api/2.1/jobs/run-now", headers=H, json={"job_id": job_id}, timeout=60).json()["run_id"]
              print("job", job_id, "run", run_id, "environment client", spec["environments"][0]["spec"]["client"])
              while True:
                  r = requests.get(f"{host}/api/2.1/jobs/runs/get", headers=H, params={"run_id": run_id}, timeout=60).json()
                  st = r["state"]; print(st.get("life_cycle_state"), st.get("result_state", ""), flush=True)
                  if st["life_cycle_state"] in ("TERMINATED", "SKIPPED", "INTERNAL_ERROR"): break
                  time.sleep(30)
              return job_id, run_id, r, st
          # Serverless environment versions differ by workspace (run 40000440021: "Workspace doesn't support Client-1 channel").
          # Try the documented versions in order and record the one this workspace accepts.
          env_used = None
          for client_ver in ("3", "2", "4", "1"):
              spec["environments"][0]["spec"]["client"] = client_ver
              job_id, run_id, r, st = upsert_and_run(spec)
              msg = (st.get("state_message") or "") + json.dumps(r.get("tasks", []), default=str)
              if "platform channel" in msg or "Client-" in msg and "channel" in msg:
                  print(f"environment client {client_ver} rejected by workspace; trying next"); continue
              env_used = client_ver; break
          out = {"stamp": {"github_run_id": os.environ.get("GITHUB_RUN_ID"), "commit": os.environ.get("GITHUB_SHA","")[:12],
                           "utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(timespec="seconds"),
                           "catalog": os.environ["CATALOG"], "ingest_run_id": "${{ inputs.raw_artifact_run_id }}", "serverless_environment_client": env_used},
                 "job_id": job_id, "run_id": run_id, "run_page_url": r.get("run_page_url"), "state": st, "tasks": []}
          for t in r.get("tasks", []):
              o = requests.get(f"{host}/api/2.1/jobs/runs/get-output", headers=H, params={"run_id": t["run_id"]}, timeout=60).json()
              out["tasks"].append({"task_key": t["task_key"], "state": t.get("state"), "notebook_output": o.get("notebook_output"), "error": o.get("error")})
          # Databricks totals (from the notebook's exit JSON) vs the DuckDB build of the same raw data
          dbx = {}
          for t in out["tasks"]:
              res = (t.get("notebook_output") or {}).get("result")
              if t["task_key"] == "silver_gold_anomalies" and res:
                  try: dbx = json.loads(res)
                  except Exception: dbx = {"raw": res}
          cmp = {}
          if pathlib.Path("build/civiclens.duckdb").exists() and dbx.get("silver") is not None:
              import duckdb
              c = duckdb.connect("build/civiclens.duckdb", read_only=True)
              duck = {"bronze": c.execute("SELECT COUNT(*) FROM bronze_prime_transactions").fetchone()[0],
                      "silver": c.execute("SELECT COUNT(*) FROM silver_contract_transactions").fetchone()[0],
                      "rejects": c.execute("SELECT COUNT(*) FROM silver_rejects").fetchone()[0],
                      "silver_sum": float(c.execute("SELECT COALESCE(SUM(obligation),0) FROM silver_contract_transactions").fetchone()[0]),
                      "gold_award_sum": float(c.execute("SELECT COALESCE(SUM(obligations),0) FROM gold_award_fy").fetchone()[0]),
                      "flagged_large": c.execute("SELECT COUNT(*) FROM anomaly_large_award WHERE status='flagged'").fetchone()[0],
                      "scored_large": c.execute("SELECT COUNT(*) FROM anomaly_large_award WHERE status IN ('flagged','normal')").fetchone()[0]}
              for k, v in duck.items():
                  dv = dbx.get(k)
                  same = (abs(float(dv) - float(v)) < 0.005) if isinstance(v, float) else (dv == v)
                  cmp[k] = {"databricks": dv, "duckdb": v, "match": bool(same)}
          out["databricks_dq"] = dbx; out["vs_duckdb"] = cmp
          ok = st.get("result_state") == "SUCCESS" and dbx.get("gold_equals_silver") is True and all(x["match"] for x in cmp.values())
          out["pass"] = ok
          pathlib.Path("evidence/pipeline").mkdir(parents=True, exist_ok=True)
          json.dump(out, open("evidence/pipeline/databricks_run.json", "w"), indent=1)
          md = [f"# Databricks lakehouse run — **{'PASS' if ok else 'FAIL'}**", "",
                f"GitHub run `{out['stamp']['github_run_id']}` · commit `{out['stamp']['commit']}` · {out['stamp']['utc']} · catalog `{out['stamp']['catalog']}` · "
                f"ingest run `{out['stamp']['ingest_run_id']}` · Databricks job {job_id} run {run_id} · serverless environment client `{env_used}` · wheel `{whl_volume}` · state {st.get('result_state')} · [run page]({r.get('run_page_url')})", "",
                "Tables: `{c}.bronze.prime_transactions`, `{c}.silver.contract_transactions`, `{c}.silver.rejects`, `{c}.gold.award_fy|agency_fy|recipient_agency_fy|psc_fy`, "
                "`{c}.gold.anomaly_large_award|anomaly_concentration|anomaly_recipient_growth` (Delta, Unity Catalog).".format(c=out['stamp']['catalog']), "",
                "| metric | Databricks (Spark, Delta) | DuckDB build of the same raw data | match |", "|---|---|---|---|"]
          md += [f"| {k} | {v['databricks']} | {v['duckdb']} | {'yes' if v['match'] else 'NO'} |" for k, v in cmp.items()] or ["| (no DuckDB snapshot supplied; Databricks DQ only) | | | |"]
          md += ["", f"Databricks in-job DQ: `{json.dumps(dbx)[:800]}`"]
          for t in out["tasks"]:
              if t.get("error"): md += ["", f"Task {t['task_key']} error: `{str(t['error'])[:500]}`"]
          pathlib.Path("evidence/pipeline/databricks_run.md").write_text("\n".join(md) + "\n")
          print("\n".join(md))
          assert ok, st
          PY
      - name: Commit evidence
        if: always()
        run: |
          git config user.name civiclens-bot; git config user.email actions@users.noreply.github.com
          git add evidence/pipeline && git commit -m "evidence: databricks pipeline run ${{ github.run_id }} (${{ steps.job.outcome }})" || echo "nothing to commit"
          git status --short | head -20
          pushed=0; for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && pushed=1 && break || sleep 10; done
          test "$pushed" = 1 || { echo "::error::evidence push failed after 3 attempts"; exit 1; }
      - if: steps.job.outcome != 'success'
        run: exit 1
