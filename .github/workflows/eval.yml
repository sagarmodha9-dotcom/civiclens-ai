name: eval-investigator
# Real model evaluation of the AI investigator against a snapshot built by an ingest run.
# 40 cases: numeric correctness vs reference SQL, citation integrity, unsupported-claim judge, refusal behaviour.
# Results (pass and fail alike) are committed to evidence/eval/. Cost is bounded by the case count (~40 Haiku + 40 Sonnet-judge calls).
on:
  workflow_dispatch:
    inputs:
      ingest_run_id:
        description: "ingest-usaspending run id whose snapshot-<id> artifact to evaluate"
        required: true
      only:
        description: "comma list of case ids (blank = all)"
        default: ""
      set:
        description: "regression (40 cases, used while fixing) or holdout (independent set, never tuned on; reported separately)"
        default: "regression"
permissions:
  contents: write
  actions: read
concurrency: eval-${{ inputs.set }}
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "api[test]" 2>/dev/null || pip install -e "api" pytest
      - name: Download snapshot from the ingest run
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh run download "${{ inputs.ingest_run_id }}" -n "snapshot-${{ inputs.ingest_run_id }}" -D build
          ls -la build
          python - <<'EOF'
          import duckdb
          c = duckdb.connect("build/civiclens.duckdb", read_only=True)
          import json; m = json.loads(c.execute("SELECT meta_json FROM _meta").fetchone()[0])
          print("snapshot:", m.get("snapshot_version"), "dq:", m.get("dq", {}).get("_all_pass"), "\nanomalies:", json.dumps(m.get("anomaly_summary"), indent=1))
          EOF
      - name: API tests against the real snapshot
        env:
          CIVICLENS_SNAPSHOT: ${{ github.workspace }}/build/civiclens.duckdb
        run: cd api && python -m pytest -q tests 2>&1 | tail -5
      - name: Evaluate
        id: ev
        env:
          CIVICLENS_SNAPSHOT: ${{ github.workspace }}/build/civiclens.duckdb
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          sub=""; [ "${{ inputs.set }}" = "holdout" ] && sub="/holdout"
          python -m civiclens_api.evaluate --set "${{ inputs.set }}" --out "evidence/eval$sub" --only "${{ inputs.only }}"
        working-directory: api
        continue-on-error: true
      - name: Commit results
        if: always()
        run: |
          sub=""; [ "${{ inputs.set }}" = "holdout" ] && sub="/holdout"
          mkdir -p "evidence/eval$sub" && cp -r api/evidence/eval/. evidence/eval/ 2>/dev/null || true
          echo "ingest_run_id=${{ inputs.ingest_run_id }} eval_run_id=${{ github.run_id }} set=${{ inputs.set }} outcome=${{ steps.ev.outcome }}" > "evidence/eval$sub/run.txt"
          # Each set owns only its own files (never the other set's folder); the shared script rebuilds the commit on origin/main on a race.
          scripts/commit_evidence.sh "evidence: investigator evaluation [${{ inputs.set }}] (${{ steps.ev.outcome }}) on snapshot of ingest run ${{ inputs.ingest_run_id }}" \
            "evidence/eval$sub/results.json" "evidence/eval$sub/results.md" "evidence/eval$sub/run.txt"
      - if: steps.ev.outcome != 'success'
        run: exit 1
