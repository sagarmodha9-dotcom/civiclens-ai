name: validate-anomalies
# M3: independent validation of the anomaly engine against the real snapshot of an ingest run.
# Re-implements the three detectors in Python/NumPy and compares with the pipeline's tables, then traces a sample of
# flagged records back to the raw USAspending rows. Writes evidence/anomalies/validation.{md,json} (PASS/FAIL, stamped).
on:
  workflow_dispatch:
    inputs:
      ingest_run_id:
        description: "ingest-usaspending run id whose snapshot-<id> artifact to validate"
        required: true
permissions:
  contents: write
  actions: read
concurrency: anomalies
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "lakehouse" numpy
      - name: Download snapshot from the ingest run
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download "${{ inputs.ingest_run_id }}" -n "snapshot-${{ inputs.ingest_run_id }}" -D build && ls -la build
      - name: Validate
        id: val
        env: { INGEST_RUN_ID: "${{ inputs.ingest_run_id }}" }
        run: python -m civiclens_lakehouse.validate_anomalies --snapshot build/civiclens.duckdb --out evidence/anomalies
        continue-on-error: true
      - name: Commit evidence
        if: always()
        run: |
          echo "ingest_run_id=${{ inputs.ingest_run_id }} validate_run_id=${{ github.run_id }} outcome=${{ steps.val.outcome }}" > evidence/anomalies/run.txt
          git config user.name civiclens-bot; git config user.email actions@users.noreply.github.com
          git add evidence/anomalies && git commit -m "evidence: anomaly engine validation (${{ steps.val.outcome }}) on snapshot of ingest run ${{ inputs.ingest_run_id }}" || echo "nothing to commit"
          pushed=0; for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && pushed=1 && break || sleep 10; done
          test "$pushed" = 1 || { echo "::error::evidence push failed after 3 attempts"; exit 1; }
      - if: steps.val.outcome != 'success'
        run: exit 1
