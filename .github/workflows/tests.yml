name: tests
# Unit + integration tests for the three Python packages, web typecheck/build, and the security gate
# (gitleaks over the FULL git history, pip-audit, npm audit). Security results are uploaded as artifacts and
# summarised in evidence/security/ by the security-evidence step on main.
on: [push, pull_request]
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "ingest[test]" -e "lakehouse[test]" -e "api[test]"
      - run: cd ingest && pytest -q
      - run: cd lakehouse && PYTHONPATH=tests pytest -q
      - run: cd api && pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: cd web && npm run typecheck
      - run: cd web && npm run build
        env: { NEXT_PUBLIC_API_URL: "https://civiclens-api.fly.dev" }
  web-e2e:
    # Browser tests against a LOCAL build on every push/PR (desktop Chrome + Pixel 7 + axe), on a synthetic snapshot, so a UI
    # regression fails here before deploy.yml ever touches production. The gate is the same as the live one: at least 10
    # expected tests must run and none may fail — a run with 0 tests is a failure, not a pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e "ingest" -e "lakehouse[test]" -e "api"
      - name: Synthetic snapshot (DQ gate must pass)
        run: PYTHONPATH=lakehouse/tests python scripts/make_e2e_snapshot.py build/e2e.duckdb
      - name: Start API
        run: |
          (cd api && CIVICLENS_SNAPSHOT=../build/e2e.duckdb nohup python -m uvicorn civiclens_api.main:app --port 8000 > ../api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break || sleep 1; done
          curl -sf localhost:8000/healthz
      - name: Build and start web
        working-directory: web
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
        run: |
          npm ci
          npm run build
          (nohup npx next start -p 3000 > ../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3000/ && break || sleep 1; done
          curl -sf -o /dev/null localhost:3000/
      - name: Playwright (desktop + mobile + axe) against the local build
        working-directory: web
        env: { E2E_BASE_URL: "http://localhost:3000", E2E_API_URL: "http://localhost:8000" }
        run: |
          npx playwright install --with-deps chromium
          npx playwright test 2>&1 | tee ../e2e-local.log | tail -40
          python3 -c "import json,sys; st=json.load(open('test-results/results.json'))['stats']; print(st); sys.exit(1 if (st.get('expected',0) < 10 or st.get('unexpected',0)) else 0)"
      - name: Upload local e2e log, results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-${{ github.run_id }}
          path: |
            e2e-local.log
            api.log
            web.log
            web/test-results
          if-no-files-found: ignore
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                      # full history for gitleaks
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: gitleaks (every commit in history)
        id: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --log-opts="--all" --report-format json --report-path gitleaks.json --exit-code 2 -v 2>&1 | tail -5; echo "rc=$?"
          test -f gitleaks.json || echo "[]" > gitleaks.json
          python3 -c "import json; r=json.load(open('gitleaks.json')); print('findings:', len(r)); raise SystemExit(1 if r else 0)"
      - name: pip-audit (api, lakehouse, ingest)
        id: pipaudit
        run: |
          pip install -q pip-audit -e api -e lakehouse -e ingest
          # --skip-editable: our three local packages are not on PyPI (run 40008859311 failed on that); their dependencies are audited.
          pip-audit --skip-editable --desc -f json -o pip-audit.json || true
          test -s pip-audit.json || { echo "::error::pip-audit produced no report"; exit 1; }
          python3 -c "import json; d=json.load(open('pip-audit.json')); v=[x for x in d.get('dependencies',[]) if x.get('vulns')]; print('vulnerable packages:', [(x['name'],x['version'],[y['id'] for y in x['vulns']]) for x in v]); raise SystemExit(1 if v else 0)"
      - name: npm audit (web, production deps, high+)
        id: npmaudit
        run: |
          cd web && npm ci --ignore-scripts >/dev/null
          npm audit --omit=dev --audit-level=high --json > ../npm-audit.json || true
          python3 -c "import json; d=json.load(open('../npm-audit.json')); m=d['metadata']['vulnerabilities']; print(m); assert 'total' in m, d; raise SystemExit(1 if (m.get('high',0)+m.get('critical',0)) else 0)"
      - name: Security evidence
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p evidence/security
          python3 - <<'PY'
          import json, datetime as dt, pathlib, os
          g = json.load(open("gitleaks.json")) if pathlib.Path("gitleaks.json").exists() else None
          p = json.load(open("pip-audit.json")) if pathlib.Path("pip-audit.json").exists() else {}
          n = json.load(open("npm-audit.json")) if pathlib.Path("npm-audit.json").exists() else {}
          pv = [x for x in p.get("dependencies", []) if x.get("vulns")]
          nm = n.get("metadata", {}).get("vulnerabilities", {})
          audited = len(p.get("dependencies", []))
          complete = g is not None and audited > 0 and "total" in nm          # every scanner must have produced a real report
          ok = complete and g == [] and not pv and not (nm.get("high", 0) + nm.get("critical", 0))
          rep = {"stamp": {"github_run_id": os.environ["GITHUB_RUN_ID"], "commit": os.environ["GITHUB_SHA"][:12], "utc": dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")},
                 "gitleaks_findings": None if g is None else len(g), "pip_audit_packages_audited": audited,
                 "pip_audit_vulnerable": [(x["name"], x["version"], [y["id"] for y in x["vulns"]]) for x in pv],
                 "npm_audit": nm, "all_scanners_reported": complete, "pass": ok}
          pathlib.Path("evidence/security/report.json").write_text(json.dumps(rep, indent=1))
          md = [f"# Security gate — **{'PASS' if ok else 'FAIL'}**", "", f"GitHub run `{rep['stamp']['github_run_id']}` · commit `{rep['stamp']['commit']}` · {rep['stamp']['utc']}", "",
                f"- gitleaks over the full git history (`--log-opts=--all`): {rep['gitleaks_findings']} finding(s)",
                f"- pip-audit (dependencies of api, lakehouse, ingest; {audited} packages audited): {len(pv)} vulnerable package(s) {rep['pip_audit_vulnerable'] or ''}",
                f"- npm audit (web, production dependencies): {json.dumps(nm) if nm else 'NO REPORT'}",
                f"- all scanners produced a report: {complete}",
                "", "Rate limits in production: per-IP hourly and global daily caps on the investigator, a monthly token budget that switches to cached answers, "
                "read-only tools only (no SQL tool, no network, no writes), and all secrets provided via GitHub Actions secrets / Fly secrets — never in source."]
          pathlib.Path("evidence/security/report.md").write_text("\n".join(md) + "\n"); print("\n".join(md))
          PY
          scripts/commit_evidence.sh "evidence: security gate run ${{ github.run_id }}" evidence/security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: "*.json"
