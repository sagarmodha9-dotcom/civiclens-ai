name: databricks-preflight
# Proves, step by step, what the Databricks workspace supports for unattended use from GitHub Actions:
# identity, catalog discovery, schema + volume creation, Files API round trip, Jobs API, and one real serverless
# notebook run that writes and counts a Delta table. Report: evidence/databricks/preflight.md (run id, SHA, PASS/FAIL).
on:
  workflow_dispatch:
    inputs:
      skip_job:
        description: "skip the real serverless job execution step"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: databricks
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Preflight
        id: pf
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          git rm -q --ignore-unmatch evidence/databricks/auth-proof.md
          PREFLIGHT_OUT=evidence/databricks python lakehouse/databricks/preflight.py --out evidence/databricks ${{ inputs.skip_job && '--skip-job' || '' }}
        continue-on-error: true
      - name: Commit evidence
        if: always()
        run: |
          cat evidence/databricks/preflight.md || echo '(no report written)'
          git config user.name civiclens-bot; git config user.email actions@users.noreply.github.com
          git add -A evidence/databricks && git commit -m "evidence: databricks preflight run ${{ github.run_id }} (${{ steps.pf.outcome }})" || echo "nothing to commit"
          git status --short | head -20
          pushed=0; for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && pushed=1 && break || sleep 10; done
          test "$pushed" = 1 || { echo "::error::evidence push failed after 3 attempts"; exit 1; }
      - if: steps.pf.outcome != 'success'
        run: exit 1
