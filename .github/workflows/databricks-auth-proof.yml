name: databricks-auth-proof
# Proves (or disproves) unattended automation on Databricks Free Edition: with only a repo secret, can Actions
# upload a file to a Unity Catalog Volume and read it back via the Files API? Writes the result to evidence/.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe workspace identity, Files API upload/read/delete, Jobs API list
        run: |
          set -u
          mkdir -p evidence/databricks
          out=evidence/databricks/auth-proof.md
          echo "# Databricks unattended-auth proof — $(date -u +%Y-%m-%dT%H:%MZ)" > $out
          echo "" >> $out
          if [ -z "${DATABRICKS_HOST:-}" ] || [ -z "${DATABRICKS_TOKEN:-}" ]; then echo "secrets DATABRICKS_HOST / DATABRICKS_TOKEN not set" | tee -a $out; exit 1; fi
          # normalise host: keep scheme + domain only (a pasted browser URL often carries /browse?o=... which breaks API paths)
          DATABRICKS_HOST=$(printf '%s' "$DATABRICKS_HOST" | sed -E 's#^(https?://[^/?#]+).*$#\1#')
          case "$DATABRICKS_HOST" in https://*) ;; *) DATABRICKS_HOST="https://$DATABRICKS_HOST";; esac
          echo "host used: $DATABRICKS_HOST" | tee -a $out
          # sanity on secret SHAPES only (never values): a PAT starts with dapi; a host contains databricks
          case "$DATABRICKS_TOKEN" in dapi*) echo "token shape: ok (dapi…)" | tee -a $out;; *) echo "token shape: UNEXPECTED (does not start with dapi; was the URL pasted into DATABRICKS_TOKEN?)" | tee -a $out;; esac
          case "$DATABRICKS_HOST" in *databricks*) echo "host shape: ok" | tee -a $out;; *) echo "host shape: UNEXPECTED (no 'databricks' in it; was the token pasted into DATABRICKS_HOST?)" | tee -a $out;; esac
          echo "" >> $out
          H="Authorization: Bearer $DATABRICKS_TOKEN"
          me=$(curl -sS -w '\n%{http_code}' -H "$H" "$DATABRICKS_HOST/api/2.0/preview/scim/v2/Me"); code=$(echo "$me" | tail -1)
          echo "| step | HTTP | note |" >> $out; echo "|---|---|---|" >> $out
          who=$(echo "$me" | head -1 | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("userName","?"))' 2>/dev/null || echo "(non-JSON body: $(echo "$me" | head -1 | tr -d '\n' | cut -c1-80 | sed 's/[<>]//g'))")
          echo "| whoami (SCIM Me) | $code | $who |" >> $out
          cats=$(curl -sS -o /dev/null -w '%{http_code}' -H "$H" "$DATABRICKS_HOST/api/2.1/unity-catalog/catalogs"); echo "| list catalogs | $cats | |" >> $out
          # Ensure catalog civiclens, schemas bronze/silver/gold and managed volume bronze.raw exist (idempotent: 200 created, 409/400 already exists).
          UC="$DATABRICKS_HOST/api/2.1/unity-catalog"; J='Content-Type: application/json'
          cc=$(curl -sS -o /tmp/cc.json -w '%{http_code}' -X POST -H "$H" -H "$J" -d '{"name":"civiclens","comment":"CivicLens AI lakehouse"}' "$UC/catalogs"); echo "| create catalog civiclens | $cc | $(python3 -c 'import json;d=json.load(open("/tmp/cc.json"));print(d.get("error_code") or d.get("full_name") or "")' 2>/dev/null | cut -c1-60) |" >> $out
          for s in bronze silver gold; do
            sc=$(curl -sS -o /tmp/sc.json -w '%{http_code}' -X POST -H "$H" -H "$J" -d "{\"name\":\"$s\",\"catalog_name\":\"civiclens\"}" "$UC/schemas"); echo "| create schema $s | $sc | $(python3 -c 'import json;d=json.load(open("/tmp/sc.json"));print(d.get("error_code") or d.get("full_name") or "")' 2>/dev/null | cut -c1-60) |" >> $out
          done
          vc=$(curl -sS -o /tmp/vc.json -w '%{http_code}' -X POST -H "$H" -H "$J" -d '{"name":"raw","catalog_name":"civiclens","schema_name":"bronze","volume_type":"MANAGED"}' "$UC/volumes"); echo "| create volume bronze.raw | $vc | $(python3 -c 'import json;d=json.load(open("/tmp/vc.json"));print(d.get("error_code") or d.get("full_name") or "")' 2>/dev/null | cut -c1-60) |" >> $out
          vol="$DATABRICKS_HOST/api/2.0/fs/files/Volumes/civiclens/bronze/raw/_authproof/$(date -u +%s).txt"
          up=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "$H" -H 'Content-Type: application/octet-stream' --data-binary 'civiclens auth proof' "$vol"); echo "| Files API PUT to Volume | $up | needs catalog civiclens, schema bronze, volume raw to exist |" >> $out
          rd=$(curl -sS -o /dev/null -w '%{http_code}' -H "$H" "$vol"); echo "| Files API GET | $rd | |" >> $out
          dl=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$H" "$vol"); echo "| Files API DELETE | $dl | |" >> $out
          jobs=$(curl -sS -o /dev/null -w '%{http_code}' -H "$H" "$DATABRICKS_HOST/api/2.1/jobs/list?limit=1"); echo "| Jobs API list | $jobs | |" >> $out
          cat $out
          git config user.name civiclens-bot; git config user.email actions@users.noreply.github.com
          git add evidence/databricks && git commit -m "evidence: databricks auth proof" || true
          git status --short | head -20
          pushed=0; for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && pushed=1 && break || sleep 10; done
          test "$pushed" = 1 || { echo "::error::evidence push failed after 3 attempts"; exit 1; }
          [ "$code" = "200" ] && [ "$jobs" = "200" ]
