[project]
name = "civiclens-ingest"
version = "0.1.0"
description = "CivicLens AI: USAspending ingestion worker and live API probe"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["civiclens_ingest*"]
